<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Республика Роэзис — главная</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eaeef2;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            gap: 25px;
            flex: 1;
        }
        .sidebar {
            width: 250px;
            background: #f8f9fa;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 20px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }
        .sidebar h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #2c6e9e;
        }
        .sidebar ul {
            list-style: none;
        }
        .sidebar li {
            margin-bottom: 10px;
        }
        .sidebar a {
            text-decoration: none;
            color: #2c6e9e;
            font-weight: 500;
            transition: 0.2s;
            display: block;
            padding: 5px 0;
        }
        .sidebar a:hover {
            color: #0d3d5c;
            text-decoration: underline;
        }
        .main-content {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 30px;
        }
        .main-content h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #1a3e50;
            border-bottom: 3px solid #2c6e9e;
            display: inline-block;
            padding-bottom: 8px;
        }
        .main-content h2 {
            margin: 25px 0 15px 0;
            color: #2c6e9e;
            font-size: 1.6rem;
        }
        .main-content h3 {
            margin: 20px 0 10px;
            color: #1e3a4a;
        }
        .main-content p {
            margin-bottom: 15px;
            text-align: justify;
        }
        .main-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: #fff;
        }
        .main-content th, .main-content td {
            border: 1px solid #ccc;
            padding: 10px;
            vertical-align: top;
        }
        .main-content th {
            background: #eef3f7;
            font-weight: 600;
        }
        .infobox {
            float: right;
            width: 300px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            margin: 0 0 15px 20px;
            padding: 12px;
            font-size: 0.9rem;
        }
        .footer {
            text-align: center;
            margin-top: auto;
            padding: 20px;
            background: #1e2f3a;
            color: #ccc;
            font-size: 0.9rem;
        }
        @media (max-width: 800px) {
            .container { 
                flex-direction: column;
                margin: 20px auto;
            }
            .sidebar { 
                width: 100%; 
                position: static; 
            }
            .infobox { 
                float: none; 
                width: 100%; 
                margin: 15px 0; 
            }
        }
        .badge {
            background: #2c6e9e;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    ХУЙХУЙХУЙХУХЙУХЙХУЙХУХЙУХЙХУЙХУХЙУХ
</div>

<footer class="footer">
    © 2027 Энциклопедия «Роэзис». Данные актуальны на май 2027 года.
</footer>

</body>
</html>
